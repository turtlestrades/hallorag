server:
  port: 8080

spring:
  application:
    name: hallorag-backend

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:ragdb}
    username: ${DB_USER:raguser}
    password: ${DB_PASSWORD:ragpassword}
    driver-class-name: org.postgresql.Driver

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://host.docker.internal:11434}
      chat:
        enabled: true
        options:
          model: ${CHAT_MODEL:llama3.2:3b}
          temperature: 0.2
      embedding:
        enabled: true
        options:
          model: ${EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        table-name: vector_store
        schema-name: public
        initialize-schema: false

hallorag:
  rag:
    default-top-k: 4
    default-similarity-threshold: 0.5
    chunk-size: 400
    min-chunk-size-chars: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info
